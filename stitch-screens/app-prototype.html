<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ShilpMitra - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdcc6",
                        "on-primary-container": "#9da1ff",
                        "on-primary": "#ffffff",
                        "on-surface": "#1b1b21",
                        "surface-container": "#f0ecf5",
                        "inverse-on-surface": "#f2eff8",
                        "surface-container-high": "#eae7f0",
                        "secondary-fixed-dim": "#ffb786",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#642f00",
                        "surface-container-highest": "#e4e1ea",
                        "on-tertiary-fixed": "#341100",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1b1b21",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e4e1ea",
                        "on-primary-fixed": "#04006d",
                        "on-primary-fixed-variant": "#373a9b",
                        "inverse-surface": "#303036",
                        "on-tertiary-fixed-variant": "#773207",
                        "primary": "#15157d",
                        "background": "#fcf8ff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f5f2fb",
                        "on-secondary-fixed": "#311300",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#4f54b4",
                        "primary-container": "#2e3192",
                        "secondary-container": "#ff8928",
                        "on-secondary-fixed-variant": "#723600",
                        "secondary": "#964900",
                        "surface-dim": "#dbd9e1",
                        "outline": "#777683",
                        "tertiary-fixed": "#ffdbcb",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ffb692",
                        "tertiary": "#491a00",
                        "primary-fixed": "#e1e0ff",
                        "on-surface-variant": "#464652",
                        "surface-bright": "#fcf8ff",
                        "inverse-primary": "#c0c1ff",
                        "on-tertiary-container": "#f19160",
                        "outline-variant": "#c7c5d4",
                        "primary-fixed-dim": "#c0c1ff",
                        "tertiary-container": "#6c2a00",
                        "surface": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "gutter": "16px",
                        "md": "16px",
                        "safe-margin": "20px",
                        "sm": "8px",
                        "unit": "4px",
                        "xl": "32px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h2-headline": ["Geist"],
                        "body-lg": ["Inter"],
                        "h1-display": ["Geist"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "h3-title": ["Geist"]
                    },
                    "fontSize": {
                        "h2-headline": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1-display": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h3-title": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center pb-safe-margin">
<!-- Top Navigation (Suppressed Bottom Nav as this is Onboarding) -->
<header class="w-full flex justify-between items-center px-safe-margin py-xs max-w-xl mx-auto bg-surface/80 backdrop-blur-md shadow-sm fixed top-0 z-50">
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h2-headline text-h2-headline font-bold text-primary">शिल्पमित्र</h1>
<button class="p-2 text-primary hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">translate</span>
</button>
</header>
<!-- Main Content Container -->
<main class="w-full max-w-md mx-auto pt-[80px] px-safe-margin flex-grow flex flex-col gap-xl">
<!-- Hero Section -->
<section class="w-full rounded-2xl overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.04)] relative h-[240px]">
<img alt="Modern Indian Artisan" class="w-full h-full object-cover" data-alt="A beautifully lit portrait of a modern Indian artisan working in a clean, minimalist studio space. The artisan is focused, combining traditional craft with contemporary techniques. Soft, high-key natural light floods the room, creating a bright, uplifting mood that aligns with a premium, rural-startup aesthetic. Subtle hints of deep indigo and saffron in the background subtly reference the brand's color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwna6_Zjy-YgHJ7Y5tZDfWnEUf7xKAiUtlIpT4pHt_naSyTRA5HEK8lJh8zSsvu4staCosU9gdkLhl4FzkjkErTCwoRwmOufuG2ERY4nKYkQLAUuyJdpvCVi182RMf-tobEoOiIH07iUNXsQvGYpfgMIY85ZPrWuoit_oUib81WXR48yWDYvxatJjO_PHSfpPaFifVgkGkbDjr_449JcCOVkhVmetswaaSNi9puo80WVBWVEFB06-dBZbT8q166-OOy9eo4csfT7mt"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent flex items-end p-lg">
<div class="text-on-primary">
<h2 class="font-h1-display text-h1-display mb-sm">नमस्ते</h2>
<p class="font-body-lg text-body-lg opacity-90">Welcome to ShilpMitra</p>
</div>
</div>
</section>
<!-- Language Selection Bento -->
<section class="flex flex-col gap-md">
<h3 class="font-h3-title text-h3-title text-on-surface">Select Language / भाषा चुनें</h3>
<div class="grid grid-cols-3 gap-sm">
<!-- Hindi (Selected) -->
<button class="flex flex-col items-center justify-center gap-sm p-md rounded-xl bg-primary-container text-on-primary-container border-2 border-primary transition-all active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">language</span>
<span class="font-label-caps text-label-caps font-bold">हिन्दी</span>
</button>
<!-- English -->
<button class="flex flex-col items-center justify-center gap-sm p-md rounded-xl bg-surface-container-low text-on-surface border-2 border-transparent hover:bg-surface-container-high transition-all active:scale-95">
<span class="font-h3-title text-h3-title">A</span>
<span class="font-label-caps text-label-caps">English</span>
</button>
<!-- Kannada -->
<button class="flex flex-col items-center justify-center gap-sm p-md rounded-xl bg-surface-container-low text-on-surface border-2 border-transparent hover:bg-surface-container-high transition-all active:scale-95">
<span class="font-h3-title text-h3-title">ಅ</span>
<span class="font-label-caps text-label-caps">ಕನ್ನಡ</span>
</button>
</div>
</section>
<!-- Profile Setup Form (Glassmorphism card) -->
<section class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-2xl p-lg shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant/30 flex flex-col gap-lg">
<div class="flex items-center gap-sm mb-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person_add</span>
<h3 class="font-h3-title text-h3-title text-on-surface">Artisan Profile Setup</h3>
</div>
<!-- Name Input -->
<div class="relative">
<input class="peer w-full h-[56px] px-md pt-sm pb-xs bg-surface-container rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder-transparent" id="artisanName" placeholder="Full Name" type="text"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant transition-all peer-focus:top-xs peer-focus:text-[10px] peer-focus:text-primary peer-valid:top-xs peer-valid:text-[10px] pointer-events-none" for="artisanName">Full Name</label>
</div>
<!-- Craft Type Input -->
<div class="relative">
<select class="peer w-full h-[56px] px-md pt-sm pb-xs bg-surface-container rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface appearance-none" id="craftType">
<option disabled="" selected="" value="">Select Craft</option>
<option value="pottery">Pottery</option>
<option value="handloom">Handloom</option>
<option value="woodwork">Woodwork</option>
<option value="jewelry">Jewelry Making</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<div class="flex flex-wrap gap-xs mt-[-8px]">
<span class="px-sm py-[2px] bg-secondary-container/20 text-on-secondary-container rounded-full font-label-caps text-label-caps">Pottery</span>
<span class="px-sm py-[2px] bg-secondary-container/20 text-on-secondary-container rounded-full font-label-caps text-label-caps">Handloom</span>
<span class="px-sm py-[2px] bg-secondary-container/20 text-on-secondary-container rounded-full font-label-caps text-label-caps">Woodwork</span>
</div>
</section>
</main>
<!-- Bottom Fixed Action -->
<div class="w-full max-w-md mx-auto px-safe-margin py-md sticky bottom-0 bg-gradient-to-t from-background via-background to-transparent z-40 mt-xl">
<button class="w-full h-[56px] bg-gradient-to-r from-primary to-surface-tint text-on-primary rounded-full font-body-lg text-body-lg font-bold shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-sm">
            Continue
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
